version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gha:
        patterns: ["*"]

  # Pinned CI toolchain in requirements-ci.txt. Grouped so the whole toolchain
  # moves in one reviewable PR rather than five.
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ci-tools:
        patterns: ["*"]
